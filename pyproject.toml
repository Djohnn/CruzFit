[tool.ruff]
line-length = 88
extend-exclude = [
    "venv",
    "media",
    "qa-browser-20261102",
    "**/migrations/*.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
exclude = "(^|/)(venv|docs|migrations)(/|$)|(^|/)(test_.*|.*_test)\\.py$"
